<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kur">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<meta name="theme-color" content="#dfe9e2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e2b25" media="(prefers-color-scheme: dark)">
<title>Kur</title>
<style>
:root{
  --bg:#dfe9e2; --rail:#cbdbd1; --ink:#12352c; --soft:#4d6b60; --line:#b4c8bb;
  --open:#0d7a4f; --half:#94600a; --wide:#ae2f25; --shut:#5f6f68; --field:#eef4f0; --up:#0d7a4f; --down:#ae2f25;
  --track:#b0c4b7;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e2b25; --rail:#143a31; --ink:#e7f1ea; --soft:#9db8ac; --line:#285347;
  --open:#55d29c; --half:#eeb857; --wide:#ff8d80; --shut:#9aaaa3; --field:#0a211c; --up:#55d29c; --down:#ff8d80;
  --track:#2f5c50;
}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);min-height:100dvh;
  font-family:"Avenir Next",Avenir,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-variant-numeric:tabular-nums;line-height:1.3}
.app{display:grid;grid-template-columns:minmax(0,1fr) 148px;min-height:100dvh;max-width:640px;margin:auto}
main{padding:calc(env(safe-area-inset-top) + 16px) 16px 24px calc(env(safe-area-inset-left) + 18px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;margin-bottom:6px}
#stamp{font-size:13px;color:var(--soft)}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:999px;
  min-height:44px;padding:0 14px;font-size:14px;cursor:pointer}
button:disabled{opacity:.55}
:focus-visible{outline:3px solid var(--open);outline-offset:2px}
.row{padding:15px 0 14px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-size:16px;font-weight:600}
.chg{font-size:14px;font-weight:600}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--soft)}
.val{font-size:clamp(30px,9.6vw,42px);font-weight:500;letter-spacing:-.02em;line-height:1.12;margin-top:2px}
.sub{font-size:13px;color:var(--soft);margin-top:1px;min-height:17px}
#msg{font-size:14px;margin-top:12px;color:var(--down)}
#src{font-size:12px;color:var(--soft);margin-top:12px}
aside{background:var(--rail);padding:calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + 12px) 24px 12px;font-size:13px}
.clock{font-size:26px;font-weight:500;letter-spacing:-.01em}
.date{color:var(--soft);margin-bottom:12px}
.mk{padding:12px 0;border-top:1px solid var(--line)}
.mk h2{font-size:14px;font-weight:600}
.st{font-weight:600;margin-top:1px}
.st.open{color:var(--open)} .st.half{color:var(--half)} .st.wide{color:var(--wide)} .st.shut{color:var(--shut)}
.bar{position:relative;height:8px;border-radius:2px;background:var(--track);margin:7px 0 6px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--open)}
.bar i.l1{background:var(--half)} .bar i.l2{background:var(--wide)}
.bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.hrs{color:var(--soft);font-size:12px}
.nx{font-size:12px;margin-top:2px}
.hol{padding-top:12px;border-top:1px solid var(--line)}
.hol h2{font-size:14px;font-weight:600}
details{margin-top:6px;font-size:12px}
summary{cursor:pointer;min-height:32px;display:flex;align-items:center;color:var(--soft)}
#list{list-style:none;padding:0}
#list li{padding:4px 0;border-top:1px solid var(--line)}
#list span{display:block;color:var(--soft)}
.fine{font-size:11px;color:var(--soft);margin-top:8px}
.amt{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:0 12px}
.amt:focus-within{border-color:var(--open)}
.amt input{flex:1;min-width:0;height:44px;border:0;background:none;color:inherit;font:inherit;font-size:18px;font-variant-numeric:tabular-nums;outline:none}
.amt input::placeholder{color:var(--soft)}
.amt input:disabled{opacity:.5}
.amt span{font-size:13px;color:var(--soft)}
.tl{padding:6px 0 14px;border-bottom:1px solid var(--line)}
#add{width:100%;margin-top:14px}
.inner{position:sticky;top:0}
dialog{border:0;border-radius:14px;background:var(--bg);color:var(--ink);padding:0;width:min(420px,calc(100vw - 24px));max-height:82dvh}
dialog::backdrop{background:rgba(5,20,16,.55)}
.sheet{display:flex;flex-direction:column;max-height:82dvh}
.shead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.shead h2{font-size:18px;font-weight:600}
.opts{overflow:auto;padding:4px 16px 16px}
.opts h3{font-size:14px;color:var(--soft);font-weight:600;margin:14px 0 2px}
.opts label{display:flex;align-items:center;gap:12px;min-height:46px;font-size:16px;border-bottom:1px solid var(--line)}
.opts input{width:20px;height:20px;accent-color:var(--open)}
.opts small{margin-left:auto;font-size:12px;color:var(--soft)}
@media (max-width:340px){.app{grid-template-columns:minmax(0,1fr) 116px}main{padding-right:10px}}
</style>
</head>
<body>
<div class="app">
  <main>
    <header>
      <span id="stamp" aria-live="polite">Kurlar yükleniyor</span>
      <button id="refresh" type="button">Yenile</button>
    </header>
    <div class="tl">
      <div class="name">Türk lirası</div>
      <label class="amt"><input id="amt-TRY" data-code="TRY" inputmode="decimal" autocomplete="off" placeholder="Tutar" aria-label="Türk lirası tutarı"><span>TL</span></label>
    </div>
    <div id="rows"></div>
    <button id="add" type="button">Döviz ekle veya çıkar</button>
    <p id="msg" hidden></p>
    <p id="src"></p>
  </main>
  <aside aria-label="Piyasa saatleri"><div class="inner">
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
    <div id="markets"></div>
    <section class="hol">
      <h2>Sıradaki resmî tatil</h2>
      <div id="next"></div>
      <details>
        <summary>Tüm tatiller</summary>
        <ul id="list"></ul>
        <p class="fine">2027 listesi resmî bayram tarihlerinden hazırlandı. Borsa İstanbul'un 2027 duyurusu çıkınca kontrol edilmeli.</p>
      </details>
      <p class="fine">Makas saatleri genel eğilimi gösterir, bankadan bankaya değişir.</p>
    </section>
  </div></aside>
</div>
<dialog id="menu" aria-label="Döviz seç">
  <div class="sheet">
    <div class="shead"><h2>Ana ekranda göster</h2><button id="done" type="button">Bitti</button></div>
    <div class="opts" id="opts"></div>
  </div>
</dialog>
<script>
"use strict";
/* ---------- Kurlar ---------- */
var ITEMS=[
  {k:"USD",n:"Dolar"},{k:"EUR",n:"Euro"},{k:"GBP",n:"Sterlin"},{k:"CHF",n:"İsviçre frangı"},
  {k:"JPY",n:"Japon yeni"},{k:"SAR",n:"Suudi riyali"},{k:"AED",n:"BAE dirhemi"},{k:"KWD",n:"Kuveyt dinarı"},
  {k:"QAR",n:"Katar riyali"},{k:"CAD",n:"Kanada doları"},{k:"AUD",n:"Avustralya doları"},{k:"CNY",n:"Çin yuanı"},
  {k:"RUB",n:"Rus rublesi"},{k:"AZN",n:"Azerbaycan manatı"},{k:"GEL",n:"Gürcü larisi"},{k:"SEK",n:"İsveç kronu"},
  {k:"NOK",n:"Norveç kronu"},{k:"DKK",n:"Danimarka kronu"},
  {k:"GRA",n:"Gram altın",g:1,u:"gram",alt:"gram-altin"},
  {k:"CEYREKALTIN",n:"Çeyrek altın",g:1,u:"adet",alt:"ceyrek-altin"},
  {k:"YARIMALTIN",n:"Yarım altın",g:1,u:"adet",alt:"yarim-altin"},
  {k:"TAMALTIN",n:"Tam altın",g:1,u:"adet",alt:"tam-altin"},
  {k:"CUMHURIYETALTINI",n:"Cumhuriyet altını",g:1,u:"adet",alt:"cumhuriyet-altini"},
  {k:"ATAALTIN",n:"Ata altın",g:1,u:"adet",alt:"ata-altin"},
  {k:"14AYARALTIN",n:"14 ayar altın",g:1,u:"gram",alt:"14-ayar-altin"},
  {k:"18AYARALTIN",n:"18 ayar altın",g:1,u:"gram",alt:"18-ayar-altin"},
  {k:"YIA",n:"22 ayar bilezik",g:1,u:"gram",alt:"22-ayar-bilezik"},
  {k:"GUMUS",n:"Gümüş",g:1,u:"gram",alt:"gumus"}
];
var BY={};ITEMS.forEach(function(i){BY[i.k]=i;});
var STORE="kur.v1",SEL="kur.sel",AMT="kur.amt",last=null,failed=false;
var chosen=["USD","EUR","GBP","CHF","GRA"],base=null,raw="";

function get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function num(v){
  if(typeof v==="number")return v;
  if(typeof v!=="string")return NaN;
  var s=v.replace(/[%$\s₺]/g,"");
  if(s.indexOf(",")>-1)s=s.replace(/\./g,"").replace(",",".");
  return parseFloat(s);
}
function typed(v){ // kullanıcının yazdığı tutar: 1.000,50 / 1000,5 / 1000.5
  var s=v.trim().replace(/\s/g,"");
  if(!s)return NaN;
  if(s.indexOf(",")>-1)s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  return /^\d*\.?\d+$|^\d+\.$/.test(s)?parseFloat(s):NaN;
}
function fmt(v,d){return v.toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d});}
function digits(k){return BY[k].g?2:4;}
function amtFmt(v){return fmt(v,Math.abs(v)>=1?2:4);}
function esc(k){return k.replace(/[^A-Za-z0-9]/g,"");}

function timeout(url){
  var c=new AbortController(),t=setTimeout(function(){c.abort();},9000);
  return fetch(url,{cache:"no-store",signal:c.signal}).then(function(r){
    clearTimeout(t);
    if(!r.ok)throw new Error("http");
    return r.json();
  });
}
function liveFeed(url){
  return timeout(url).then(function(j){
    var rates={},n=0;
    ITEMS.forEach(function(it){
      var e=j[it.k]||(it.alt&&j[it.alt]);
      if(!e)return;
      var buy=num(e.Buying!==undefined?e.Buying:e["Alış"]);
      var sell=num(e.Selling!==undefined?e.Selling:e["Satış"]);
      var chg=num(e.Change!==undefined?e.Change:e["Değişim"]);
      if(!(sell>0))return;
      rates[it.k]={sell:sell,buy:buy>0?buy:null,chg:isFinite(chg)?chg:null};n++;
    });
    if(n<3)throw new Error("format");
    return {rates:rates,mode:"live",src:"Serbest piyasa kurları, Truncgil Finans",at:Date.now()};
  });
}
function dailyFeed(){
  return timeout("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json").then(function(j){
    var u=j.usd,t=u&&u["try"];
    if(!(t>0))throw new Error("format");
    var r={USD:{sell:t,buy:null,chg:null}};
    ITEMS.forEach(function(it){
      var c=it.k.toLowerCase();
      if(!it.g&&it.k!=="USD"&&u[c]>0)r[it.k]={sell:t/u[c],buy:null,chg:null};
    });
    if(u.xau>0)r.GRA={sell:t/u.xau/31.1034768,buy:null,chg:null};
    if(u.xag>0)r.GUMUS={sell:t/u.xag/31.1034768,buy:null,chg:null};
    return {rates:r,mode:"daily",src:"Günlük referans kur, "+j.date,at:Date.now()};
  });
}
function load(){
  var btn=document.getElementById("refresh");
  btn.disabled=true;
  return liveFeed("https://finans.truncgil.com/v4/today.json")
    .catch(function(){return liveFeed("https://finans.truncgil.com/today.json");})
    .catch(dailyFeed)
    .then(function(d){last=d;failed=false;put(STORE,d);})
    .catch(function(){failed=true;})
    .then(function(){btn.disabled=false;drawRates();});
}
function buildRows(){
  document.getElementById("rows").innerHTML=chosen.map(function(k){
    var it=BY[k],id=esc(k);
    return '<div class="row"><div class="top"><span class="name">'+it.n+'</span><span class="chg" id="c-'+id+'"></span></div>'+
      '<div class="val" id="v-'+id+'">–</div><div class="sub" id="s-'+id+'"></div>'+
      '<label class="amt"><input id="amt-'+id+'" data-code="'+k+'" inputmode="decimal" autocomplete="off" placeholder="Tutar" aria-label="'+it.n+' tutarı"><span>'+(it.u||k)+'</span></label></div>';
  }).join("");
  drawRates();
}
function rate(k){
  if(k==="TRY")return 1;
  var r=last&&last.rates[k];
  return r?r.sell:0;
}
function convert(){ // tutarlar satış kuru üzerinden çevrilir
  var amt=base?typed(raw):NaN,from=base?rate(base):0;
  ["TRY"].concat(chosen).forEach(function(k){
    var el=document.getElementById("amt-"+esc(k));
    if(!el)return;
    el.disabled=k!=="TRY"&&!rate(k);
    if(k===base)return;
    el.value=(isFinite(amt)&&from&&rate(k))?amtFmt(amt*from/rate(k)):"";
  });
}
function drawRates(){
  chosen.forEach(function(k){
    var id=esc(k),r=last&&last.rates[k],d=digits(k);
    document.getElementById("v-"+id).textContent=r?fmt(r.sell,d):"–";
    var c=document.getElementById("c-"+id);
    if(r&&r.chg!==null){
      c.className="chg "+(r.chg>0?"up":r.chg<0?"down":"flat");
      c.textContent=(r.chg>0?"+":"")+fmt(r.chg,2)+"%";
    }else{c.className="chg";c.textContent="";}
    document.getElementById("s-"+id).textContent=(r&&r.buy)?
      "Alış "+fmt(r.buy,d)+", makas %"+fmt((r.sell-r.buy)/r.sell*100,2):(r?"":"Bu kaynakta veri yok");
  });
  convert();
  document.getElementById("stamp").textContent=last?("Son güncelleme "+parts(last.at).time):"Kur alınamadı";
  document.getElementById("src").textContent=last?"Büyük rakam satış fiyatıdır, çeviri bu fiyatla yapılır. "+last.src:"";
  var msg=document.getElementById("msg");
  if(failed){
    msg.hidden=false;
    msg.textContent=last?"Yeni kur alınamadı, son kayıtlı kurlar gösteriliyor. İnternetini kontrol edip Yenile'ye bas.":"Kur alınamadı. İnternetini kontrol edip Yenile'ye bas.";
  }else msg.hidden=true;
}
function drawMenu(){
  function group(title,list){
    return "<h3>"+title+"</h3>"+list.map(function(it){
      var on=chosen.indexOf(it.k)>-1,no=last&&!last.rates[it.k];
      return '<label><input type="checkbox" value="'+it.k+'"'+(on?" checked":"")+">"+it.n+(no?"<small>Veri yok</small>":"")+"</label>";
    }).join("");
  }
  document.getElementById("opts").innerHTML=
    group("Döviz",ITEMS.filter(function(i){return !i.g;}))+group("Altın ve gümüş",ITEMS.filter(function(i){return i.g;}));
}

/* ---------- Piyasalar ---------- */
var H={ // c: kapalı, h: yarım gün
"2026-01-01":["c","Yılbaşı"],
"2026-03-19":["h","Ramazan Bayramı arifesi"],"2026-03-20":["c","Ramazan Bayramı"],
"2026-04-23":["c","23 Nisan"],"2026-05-01":["c","1 Mayıs"],"2026-05-19":["c","19 Mayıs"],
"2026-05-26":["h","Kurban Bayramı arifesi"],"2026-05-27":["c","Kurban Bayramı"],"2026-05-28":["c","Kurban Bayramı"],"2026-05-29":["c","Kurban Bayramı"],
"2026-07-15":["c","15 Temmuz"],"2026-10-28":["h","Cumhuriyet Bayramı arifesi"],"2026-10-29":["c","Cumhuriyet Bayramı"],
"2027-01-01":["c","Yılbaşı"],
"2027-03-08":["h","Ramazan Bayramı arifesi"],"2027-03-09":["c","Ramazan Bayramı"],"2027-03-10":["c","Ramazan Bayramı"],"2027-03-11":["c","Ramazan Bayramı"],
"2027-04-23":["c","23 Nisan"],
"2027-05-17":["c","Kurban Bayramı"],"2027-05-18":["c","Kurban Bayramı"],"2027-05-19":["c","Kurban Bayramı, 19 Mayıs"],
"2027-07-15":["c","15 Temmuz"],"2027-08-30":["c","30 Ağustos"],
"2027-10-28":["h","Cumhuriyet Bayramı arifesi"],"2027-10-29":["c","Cumhuriyet Bayramı"]
};
var LAST_WORKDAY={"2026-12-31":1,"2027-12-31":1};
var DAYS=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
var MONTHS=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
var HOUR=36e5,MIN=6e4,DAY=864e5,TR=3*HOUR; // Türkiye yıl boyu UTC+3

function p2(n){return (n<10?"0":"")+n;}
function parts(ms){
  var d=new Date(ms+TR);
  var key=d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate());
  var mins=d.getUTCHours()*60+d.getUTCMinutes();
  return {key:key,wd:d.getUTCDay(),mins:mins,time:p2(d.getUTCHours())+":"+p2(d.getUTCMinutes()),
    day:d.getUTCDate(),mon:d.getUTCMonth()};
}
function t(s){return +s.slice(0,2)*60+ +s.slice(3);}
var nyFmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
function rollover(ms){ // New York 17:00 gün dönümü çevresi
  var o={};nyFmt.formatToParts(new Date(ms)).forEach(function(x){o[x.type]=x.value;});
  var m=+o.hour*60+ +o.minute;
  return m>=1005&&m<1080;
}
function spread(ms){ // 0 normal, 1 geniş, 2 çok geniş
  var p=parts(ms),h=H[p.key];
  if(p.wd===0||p.wd===6||(h&&h[0]==="c"))return 2;
  if(rollover(ms))return 2;
  if(p.wd===1&&p.mins<540)return 2;
  var end=(h&&h[0]==="h")?780:1020;
  return (p.mins>=540&&p.mins<end)?0:1;
}
var MARKETS=[
  {n:"Borsa İstanbul",sess:function(half){return half?[["09:40","12:40"]]:[["09:40","18:10"]];}},
  {n:"VİOP",sess:function(half,key){
    if(half)return [["09:30","12:45"]];
    var a=[["09:30","18:15"]];
    if(!LAST_WORKDAY[key])a.push(["19:00","23:00"]);
    return a;}}
];
function sessions(m,p){
  var h=H[p.key];
  if(p.wd===0||p.wd===6||(h&&h[0]==="c"))return [];
  return m.sess(!!h,p.key);
}
function isOpen(m,ms){
  var p=parts(ms);
  return sessions(m,p).some(function(s){return p.mins>=t(s[0])&&p.mins<t(s[1]);});
}
function nextChange(m,ms){
  var step=5*MIN,cur=Math.floor(ms/step)*step,now=isOpen(m,ms);
  for(var i=1;i<=4032;i++){
    var x=cur+i*step;
    if(isOpen(m,x)!==now)return x;
  }
  return null;
}
function when(x,ms){
  var a=parts(x),b=parts(ms);
  return (a.key===b.key?"":DAYS[a.wd]+" ")+a.time;
}
function dayStart(ms){var p=parts(ms);return ms-p.mins*MIN-(ms%MIN);}
function bands(m,ms){
  var start=dayStart(ms),out="",run=-1;
  for(var i=0;i<=288;i++){
    var on=i<288&&isOpen(m,start+i*5*MIN);
    if(on&&run<0)run=i;
    if(!on&&run>=0){out+='<i style="left:'+(run/2.88)+'%;width:'+((i-run)/2.88)+'%"></i>';run=-1;}
  }
  return out;
}
function fx(ms){
  var st=dayStart(ms),step=5*MIN,bars="",run=-1,cur=null,zero=[],i,l;
  for(i=0;i<=288;i++){
    l=i<288?spread(st+i*step):null;
    if(l!==cur){
      if(cur!==null)bars+='<i class="l'+cur+'" style="left:'+(run/2.88)+'%;width:'+((i-run)/2.88)+'%"></i>';
      if(cur===0)zero.push([run,i]);
      run=i;cur=l;
    }
  }
  var lv=spread(ms),base5=Math.floor(ms/step)*step,nx=null;
  for(i=1;i<=4032;i++){
    var x=base5+i*step,v=spread(x);
    if(lv===0?v!==0:v===0){nx=x;break;}
  }
  function hm(n){var m=n*5;return p2(Math.floor(m/60)%24)+":"+p2(m%60);}
  var hrs=zero.length?"Normal "+zero.map(function(z){return hm(z[0])+"–"+hm(z[1]);}).join(", "):"Bugün normal saat yok";
  if(zero.length){ // en geniş aralık: öğleden itibaren 24 saat içinde
    var from=st+144*step,a=-1,b=-1;
    for(i=0;i<288;i++){
      if(spread(from+i*step)===2){if(a<0)a=i;b=i+1;}
      else if(a>=0)break;
    }
    if(a>=0&&b-a<48)hrs+="<br>En geniş "+parts(from+a*step).time+"–"+parts(from+b*step).time;
  }
  var name=["Normal","Geniş","Çok geniş"][lv],cl=["open","half","wide"][lv];
  var nxt=nx?(lv===0?"Genişler ":"Normale döner ")+when(nx,ms):"";
  return '<section class="mk"><h2>Döviz makası</h2><div class="st '+cl+'">'+name+'</div>'+
    '<div class="bar" aria-hidden="true">'+bars+'<b style="left:'+(parts(ms).mins/14.4)+'%"></b></div>'+
    '<div class="hrs">'+hrs+'</div><div class="nx">'+nxt+'</div></section>';
}
function drawMarkets(){
  var ms=Date.now(),p=parts(ms),h=H[p.key];
  document.getElementById("clock").textContent=p.time;
  document.getElementById("date").textContent=p.day+" "+MONTHS[p.mon]+" "+DAYS[p.wd];
  var html=fx(ms);
  MARKETS.forEach(function(m){
    var open=isOpen(m,ms),nx=nextChange(m,ms),st,cl;
    var half=h&&h[0]==="h";
    var s=sessions(m,p);
    var hrs=s.length?s.map(function(x){return x[0]+"–"+x[1];}).join("<br>"):"Bugün işlem yok";
    if(open){st=half?"Açık, yarım gün":"Açık";cl=half?"half":"open";}
    else if(h&&h[0]==="c"){st="Tatil";cl="shut";}
    else{st="Kapalı";cl="shut";}
    var nxt=nx?(open?"Kapanış ":"Açılış ")+when(nx,ms):"";
    html+='<section class="mk"><h2>'+m.n+'</h2><div class="st '+cl+'">'+st+'</div>'+
      '<div class="bar" aria-hidden="true">'+bands(m,ms)+'<b style="left:'+(p.mins/14.4)+'%"></b></div>'+
      '<div class="hrs">'+hrs+'</div><div class="nx">'+nxt+'</div></section>';
  });
  document.getElementById("markets").innerHTML=html;
  drawHolidays(p);
}
function fmtKey(k){
  var d=new Date(k+"T00:00:00Z");
  return d.getUTCDate()+" "+MONTHS[d.getUTCMonth()]+" "+d.getUTCFullYear()+" "+DAYS[d.getUTCDay()];
}
var drawnFor="";
function drawHolidays(p){
  if(drawnFor===p.key)return;
  drawnFor=p.key;
  var keys=Object.keys(H).sort().filter(function(k){return k>=p.key;});
  var next=document.getElementById("next");
  if(!keys.length){next.textContent="Takvimin güncellenmesi gerekiyor.";}
  else{
    var f=H[keys[0]];
    var left=Math.round((Date.parse(keys[0]+"T00:00:00Z")-Date.parse(p.key+"T00:00:00Z"))/DAY);
    next.innerHTML=f[1]+'<br><span style="color:var(--soft)">'+fmtKey(keys[0])+(f[0]==="h"?", yarım gün":"")+'<br>'+(left?left+" gün sonra":"Bugün")+'</span>';
  }
  document.getElementById("list").innerHTML=keys.map(function(k){
    return "<li>"+H[k][1]+"<span>"+fmtKey(k)+(H[k][0]==="h"?", yarım gün":"")+"</span></li>";
  }).join("");
}

/* ---------- Başlat ---------- */
last=get(STORE);
var savedSel=get(SEL);
if(Array.isArray(savedSel)){savedSel=savedSel.filter(function(k){return BY[k];});if(savedSel.length)chosen=savedSel;}
var savedAmt=get(AMT);
if(savedAmt&&(savedAmt.base==="TRY"||BY[savedAmt.base])&&typeof savedAmt.raw==="string"){base=savedAmt.base;raw=savedAmt.raw;}
drawMarkets();buildRows();
function restoreBase(){
  if(!base)return;
  var el=document.getElementById("amt-"+esc(base));
  if(el)el.value=raw;else{base=null;raw="";put(AMT,null);}
  convert();
}
restoreBase();load();
document.querySelector(".app").addEventListener("input",function(e){
  var code=e.target.getAttribute&&e.target.getAttribute("data-code");
  if(!code)return;
  base=code;raw=e.target.value;put(AMT,{base:base,raw:raw});convert();
});
document.getElementById("refresh").addEventListener("click",load);
var menu=document.getElementById("menu");
document.getElementById("add").addEventListener("click",function(){drawMenu();menu.showModal();});
document.getElementById("done").addEventListener("click",function(){menu.close();});
menu.addEventListener("click",function(e){if(e.target===menu)menu.close();});
document.getElementById("opts").addEventListener("change",function(e){
  var k=e.target.value;
  if(e.target.checked){if(chosen.indexOf(k)<0)chosen.push(k);}
  else if(chosen.length>1){chosen=chosen.filter(function(x){return x!==k;});}
  else{e.target.checked=true;return;}
  put(SEL,chosen);buildRows();restoreBase();
});
setInterval(drawMarkets,20000);
setInterval(function(){if(!document.hidden)load();},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){drawMarkets();load();}});
</script>
